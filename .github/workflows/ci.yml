name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Principle of least privilege
permissions:
  contents: read

jobs:
  gate-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests with coverage
        run: npm run coverage

      - name: Round-trip report freshness
        run: |
          node ./scripts/generate-roundtrip-report.js
          git diff --exit-code -- docs/ROUNDTRIP_REPORT.md tests/unit/round-trip/KNOWN_DEVIATIONS.md

      - name: Install xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Integration tests
        run: xvfb-run -a npm test

      - name: No-telemetry guard
        run: npm run check:no-telemetry

  e2e-macos:
    runs-on: macos-latest
    needs: gate-linux
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript build
        run: npm run compile

      - name: Bundle extension
        run: npm run bundle

      - name: Install ffmpeg
        run: brew install ffmpeg

      - name: Run UI E2E tests
        # Temporary #280 quarantine: keep collecting macOS E2E artifacts while
        # WebDriver/VS Code window loss is isolated. Remove after 3 consecutive
        # green e2e-macos runs.
        continue-on-error: true
        run: env E2E_VIDEO=1 npm run test:e2e

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts-macos-${{ github.sha }}
          path: artifacts/e2e/**
          retention-days: 14
